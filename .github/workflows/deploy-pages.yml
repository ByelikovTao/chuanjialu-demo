name: 发布传家录静态演示

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出静态演示
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 核对演示入口
        run: |
          test -s site/index.html
          test -s site/briefing.html

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
