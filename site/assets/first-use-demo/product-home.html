<body class="embedded">
  <div class="studio">
    <main class="stage">
      <section id="house-screen-demo" class="house-screen-demo" aria-label="传家相框演示" hidden></section>
      <div class="phone" id="phone">
        <div class="statusbar" aria-hidden="true"><b>9:41</b><div><span class="signal">▂▄▆</span><span class="wifi">◔</span><span class="battery"></span></div></div>
        <header id="app-header" class="top-nav"></header>
        <div id="app-content" class="app-content" tabindex="-1"></div>
        <nav id="bottom-nav" class="bottom-nav" aria-label="主要导航"></nav>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <div class="phone-dialog-layer">
          <dialog id="modal" class="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
        </div>
        <div class="phone-dialog-layer">
          <dialog id="addon-modal" class="modal addon-modal" aria-labelledby="addon-modal-title"><div></div></dialog>
        </div>
      </div>
    </main>
  </div>
  <!-- 完整版运行时共用的预览节点保留在内部，不进入手机界面。 -->
  <div hidden>
    <nav id="studio-nav"></nav>
    <select id="actor-select"></select>
    <select id="width-select"></select>
    <select id="scenario-select"></select>
    <button id="font-toggle" type="button"></button>
    <button id="reset-demo" type="button"></button>
    <h2 id="review-title"></h2>
    <p id="review-description"></p>
    <pre id="state-preview"></pre>
  </div>
